{% extends 'layout/base.html' %}
{% block content %}

{% if messages %}
    {% for message in messages %}
        <div style="padding: 12px 20px; margin-bottom: 15px; border-radius: 6px;
            background: {% if message.tags == 'error' %}#fee2e2{% else %}#dcfce7{% endif %};
            color: {% if message.tags == 'error' %}#991b1b{% else %}#166534{% endif %};
            font-weight: bold; font-size: 13px;">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<div style="max-width: 600px; margin: 0 auto;">
    <h2 style="color: #991b1b; margin-bottom: 25px;">EDIT TEACHER</h2>
    <div style="background: white; border-radius: 10px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 4px solid #991b1b;">
        <form method="post">
            {% csrf_token %}
            <div style="display: flex; flex-direction: column; gap: 15px;">

                <div>
                    <label style="font-size: 11px; font-weight: bold; color: #6b7280; display: block; margin-bottom: 5px;">FIRST NAME</label>
                    <input type="text" name="first_name" value="{{ teacher.first_name }}" required
                        style="width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; box-sizing: border-box;">
                </div>

                <div>
                    <label style="font-size: 11px; font-weight: bold; color: #6b7280; display: block; margin-bottom: 5px;">LAST NAME</label>
                    <input type="text" name="last_name" value="{{ teacher.last_name }}" required
                        style="width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; box-sizing: border-box;">
                </div>

                <div>
                    <label style="font-size: 11px; font-weight: bold; color: #6b7280; display: block; margin-bottom: 5px;">TEACHER ID</label>
                    <input type="text" name="teacher_id" value="{{ teacher.teacher_id }}" required
                        style="width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; box-sizing: border-box;">
                </div>

                <div>
                    <label style="font-size: 11px; font-weight: bold; color: #6b7280; display: block; margin-bottom: 5px;">EMAIL</label>
                    <!-- ✅ Email must end with .com -->
                    <input type="email" name="email" value="{{ teacher.email }}" required
                        pattern="[a-zA-Z0-9._%+\-]+@[a-zA-Z0-9.\-]+\.com"
                        title="Email must end with .com e.g. john@gmail.com"
                        style="width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; box-sizing: border-box;">
                </div>

                <div>
                    <label style="font-size: 11px; font-weight: bold; color: #6b7280; display: block; margin-bottom: 5px;">PHONE NUMBER</label>
                    <!-- ✅ Phone must be exactly 10 digits -->
                    <input type="text" name="phone_number" value="{{ teacher.phone_number }}" required
                        maxlength="10"
                        pattern="\d{10}"
                        title="Phone number must be exactly 10 digits e.g. 0712345678"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)"
                        style="width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; box-sizing: border-box;">
                    <small style="color: #6b7280; font-size: 11px;">Must be exactly 10 digits e.g. 0712345678</small>
                </div>

                <!-- Reset Password Section -->
                <div style="border-top: 1px solid #e5e7eb; padding-top: 15px; background: #fef9c3; border-radius: 6px; padding: 15px;">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" name="reset_password"
                            style="width: 16px; height: 16px; accent-color: #991b1b;">
                        <div>
                            <span style="font-size: 13px; font-weight: bold; color: #374151;">Reset Password</span>
                            <p style="font-size: 11px; color: #6b7280; margin: 3px 0 0;">
                                Teacher will be asked to create a new password on next login
                            </p>
                        </div>
                    </label>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <button type="submit"
                        style="background: #991b1b; color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer;">
                        SAVE CHANGES
                    </button>
                    <a href="{% url 'teachers_list' %}"
                        style="background: #f3f4f6; color: #374151; padding: 12px 25px; border-radius: 6px; font-weight: bold; text-decoration: none;">
                        CANCEL
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
